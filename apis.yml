aid: logiwa
name: Logiwa
description: >-
  Logiwa is a Chicago-based cloud fulfillment software company whose flagship product, Logiwa IO,
  is a warehouse management and fulfillment management system (WMS/FMS) built for high-volume
  B2C and DTC brands, wholesalers and third-party logistics providers (3PLs). Logiwa exposes a
  documented Integration API covering products, shipment orders, purchase orders, receipt orders,
  inventory, locations, count plans, documents, warehouse tasks, transaction history and 3PL
  billing, plus an eleven-topic webhook surface for order, inventory, movement and shipment
  tracking events. The API is an RPC-over-POST design: 81 documented operations, all reached by
  POST to /en/api/IntegrationApi/{Method} on a per-tenant host, authenticated with an OAuth 2.0
  password grant that yields a bearer token. Logiwa publishes no OpenAPI, AsyncAPI or other
  machine-readable contract, and no first-party SDKs; the reference is a JavaScript-rendered
  developer portal and API credentials are provisioned by sales rather than self-service.
