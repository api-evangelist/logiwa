x-contract:
  machine_readable_spec: false
  detail: >-
    Logiwa publishes 81 fully documented operations plus 11 webhook topics at
    https://developer.logiwa.com/, but no OpenAPI, Swagger, AsyncAPI, GraphQL SDL, WSDL or
    .proto. Probed 12 spec paths across 7 hosts on 2026-08-25 — docs host 404s, application
    hosts 302 to login, API gateway hosts blanket-401. See openapi/README.md for the full probe
    table.
  docs_readable: true
  docs_note: >-
    The developer portal is an AngularJS SPA whose content is served by two of Logiwa's own
    public POST endpoints (/api/Menu/GetMenuList and /api/EndPointApi/GetEndPointDetail). All
    derived artifacts in this repository were read from that anonymous public surface.
