  x-base-url-note: >-
    The API host is per-tenant. The documented pattern is https://{environment}.logiwa.com with
    the Integration API mounted at /en/api/IntegrationApi, and the matching token host at
    https://{environment}api.logiwa.com/token. app.logiwa.com (paired with appapi.logiwa.com) and
    wms.logiwa.com (paired with wmsapi.logiwa.com) are the two environments Logiwa names in its
    own Login documentation; app.logiwa.com is recorded here as the concrete production base and
    was confirmed live on 2026-08-25 (POST /en/api/IntegrationApi/LookUp returned HTTP 401 with
    the documented authorization envelope).
- name: Logiwa Webhooks
  description: >-
    Logiwa's outbound event surface. Eleven documented topics deliver order status, receipt and
    purchase order status, inventory change, location update, movement, receipt, shipment
    tracking and consolidated shipment events to a customer-configured callback URL. Subscriptions
    are configured in the Logiwa WMS UI, not through the API. Logiwa states delivery is not
    guaranteed and ordering is not guaranteed across topics, and publishes no callback signing
    mechanism.
  humanURL: https://developer.logiwa.com/?id=633d97bae6466c1730066501
  baseURL: https://developer.logiwa.com/?id=633d97bae6466c1730066501
