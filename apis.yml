apis:
- name: Logiwa Integration API
  description: >-
    The Logiwa Integration API is an RPC-over-HTTP interface with 81 documented operations
    covering products and kits, shipment orders and order details, purchase orders, receipt
    orders and receiving, inventory reporting and adjustment, available-to-promise, locations
    and pallets, count plans, documents, warehouse tasks and productivity, transaction history,
    and 3PL contract billing. Every operation is a POST that carries its filters in the JSON
    body; there are no path or query parameters. Outcome is signalled by a Success boolean in
    the response body rather than by HTTP status codes.
  humanURL: https://developer.logiwa.com/
  baseURL: https://app.logiwa.com/en/api/IntegrationApi
  tags:
