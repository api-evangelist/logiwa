name: Logiwa plans and pricing
description: >-
  Logiwa publishes NO prices. The pricing page is a quote-request form and states outright that
  it does not list prices. Separately, the developer documentation names three API user types
  (Standard, Enterprise, Premium) that carry different published request quotas, but attaches no
  price to any of them and routes the buyer to a sales representative.
