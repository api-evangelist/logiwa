findings:
- id: no-webhook-signature
  severity: high
  detail: >-
    No signing secret, HMAC header or origin-verification mechanism is published. A receiver
    cannot distinguish a genuine Logiwa callback from a forged POST.
- id: delivery-not-guaranteed
  severity: medium
  detail: >-
    Logiwa states delivery is not guaranteed and instructs integrators to run periodic
    reconciliation polls, which partly defeats the rate-limit relief webhooks are meant to give.
- id: single-callback-per-scope
  severity: medium
  detail: >-
    Only the first configured callback for a given warehouse/depositor/event-type receives the
    event, so two systems cannot both subscribe to the same scope.
- id: no-asyncapi
  severity: low
  detail: >-
    Eleven fully-documented topics with example payloads exist but no AsyncAPI document is
    published, so the event surface is not machine-readable.
