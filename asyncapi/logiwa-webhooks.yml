name: Logiwa webhook event catalog
description: >-
  Logiwa publishes a documented webhook subscription surface with eleven event topics covering
  order, receipt, purchase-order, inventory, location, movement and shipment-tracking changes.
  Each topic is documented with the processes that trigger it and a full example JSON payload.
  Logiwa publishes NO AsyncAPI document for this surface — the catalog below is the provider's
  own reference, captured; nothing here is authored on Logiwa's behalf.
asyncapi_published: false
asyncapi_probed:
- url: https://appapi.logiwa.com/asyncapi.yaml
  status: 401
- url: https://wmsapi.logiwa.com/asyncapi.yaml
  status: 401
- url: https://developer.logiwa.com/asyncapi.yaml
  status: 404
transport: HTTP callback (provider POSTs to a customer-configured Callback URL)
configuration:
  surface: Logiwa WMS UI, Webhook Setup page (not configurable via the API)
  setup_docs: https://logiwa.my.site.com/logiwahelp/s/article/Webhook-Setup
  fields:
  - name: Callback URL
    max_length: 1000
  - name: Setup Name
    max_length: 255
  - name: Notification Email
    max_length: 200
  scoping: Events are unique per warehouse, client (depositor) and event type.
delivery_guarantees:
  at_least_once: false
  guaranteed: false
  ordered: false
  published_limitations:
  - >-
    "Webhook delivery isn't always guaranteed. You should therefore implement reconciliation jobs
    to fetch data from Logiwa periodically."
  - >-
    "Ordering isn't guaranteed between different topics for the same resource. For example, a
    Status Update webhook might be delivered before a Movement webhook for order allocations."
  - >-
    "Events are unique for warehouse, client(depositor), and event type. If users add specific
    event types to multiple setups where the warehouse and depositor are the same, Logiwa only
    and always streams the event to the first designated callback." A given event cannot be
    fanned out to two callback URLs.
  signing:
    published: false
    note: >-
      No webhook signature, shared secret, HMAC header or verification procedure is documented.
      A receiver has no published way to verify that a callback came from Logiwa.
  retry_policy:
    published: false
    note: No retry schedule, backoff or dead-letter behaviour is documented.
event_count: 11
