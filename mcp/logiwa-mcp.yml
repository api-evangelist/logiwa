agent_readiness_note: >-
  Even with a server, an agent calling Logiwa would face three published obstacles: outcome is
  carried in a Success boolean rather than the HTTP status line, there is no idempotency key on
  any of the 81 POST operations, and quota exhaustion returns 403 with the retry delay embedded
  in prose rather than a Retry-After header.
