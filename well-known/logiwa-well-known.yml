name: Logiwa well-known documents
description: >-
  Two Logiwa API gateway hosts serve a real RFC 8414 / OpenID Connect discovery document at
  /.well-known/openid-configuration. Everything else probed returns 404, an authentication
  challenge, or an HTML single-page-app shell. The application hosts (app.logiwa.com) answer
  200 with an AngularJS shell for every /.well-known/* path, which is a catch-all route and
  NOT a served document — those are recorded as misses.
hosts:
- host: appapi.logiwa.com
  note: >-
    The Logiwa API gateway / token host for the app.logiwa.com environment. Documented at
    https://developer.logiwa.com/?id=5df0da39e6466c2eec992f3f ("app.logiwa.com = appapi.logiwa.com/token").
    This host returns 401 "Token is not valid" for nearly every path, so the anonymous 200 on
    openid-configuration is a deliberately published document, not a catch-all.
  documents:
  - path: /.well-known/openid-configuration
    status: 200
    file: logiwa-appapi-openid-configuration.json
    content_type: application/json
    note: >-
      Real OIDC discovery document. issuer "Ocelot" (the .NET API-gateway product name, not an
      https issuer URL) and every advertised endpoint uses the http:// scheme rather than https://.
