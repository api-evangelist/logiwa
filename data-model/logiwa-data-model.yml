source: >-
  Derived from the 81 operations and their documented request/response payloads at
  https://developer.logiwa.com/, and from the eleven webhook payload shapes.
name: Logiwa Integration API data model
description: >-
  Entity graph for the Logiwa warehouse management domain, reconstructed from the operation set
  and the documented payload fields. Logiwa uses proprietary integer surrogate keys prefixed
  Logiwa* on the event surface (LogiwaOrderId, LogiwaInventoryItemId, LogiwaReceiptOrderId) and
  bare Id/Description pairs on the LookUp reference surface. There is no published schema
  document, so field lists here are those actually observed in the provider's example payloads.
key_style:
  type: integer surrogate keys
  prefixes: false
  note: >-
    No prefixed string ids (no "so_", "itm_"). Ids are bare integers, which means an id alone
    does not identify its entity type — an agent must track type out of band.
tenancy:
  dimensions: [Warehouse, Client (also called Depositor)]
  note: >-
    Nearly every entity and every webhook payload is scoped by both WarehouseId and Client /
    Depositor. This is the multi-tenant 3PL model: one Logiwa account serves many client brands
    across many warehouses, and API user permissions are bound to specific Roles, Warehouses and
    Clients.
