findings:
- id: no-schema-document
  severity: medium
  detail: >-
    No JSON Schema, OpenAPI components or object-reference page is published. Field lists exist
    only as HTML tables and example payloads per endpoint, so no consumer can validate a payload
    before sending it.
- id: untyped-integer-ids
  severity: low
  detail: >-
    Surrogate keys are bare integers with no type prefix, so ids are only meaningful alongside
